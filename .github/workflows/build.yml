          package com.teamcape;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.texture.NativeImage;
          import net.minecraft.client.texture.NativeImageBackedTexture;
          import net.minecraft.util.AssetInfo;
          import net.minecraft.util.Identifier;

          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          public final class CapeTextures {
              private CapeTextures() {}

              public static final class Entry {
                  public final Identifier id;
                  public final int width;
                  public final int height;
                  public final boolean valid;
                  public final String problem;
                  public final AssetInfo.TextureAssetInfo asset;
                  long modified;
                  long checkedAt;

                  Entry(Identifier id, int width, int height, boolean valid, String problem, long modified) {
                      this.id = id;
                      this.width = width;
                      this.height = height;
                      this.valid = valid;
                      this.problem = problem;
                      this.modified = modified;
                      this.asset = (valid && id != null) ? new AssetInfo.TextureAssetInfo(id, id) : null;
                  }
              }

              private static final Map<String, Entry> CACHE = new HashMap<>();

              /** Ambil (dan load kalau perlu) texture cape. Harus dipanggil dari thread game/render. */
              public static synchronized Entry get(String wanted) {
                  String actual = CapeFiles.actual(wanted);
                  if (actual == null) return null;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  long now = System.currentTimeMillis();
                  Entry e = CACHE.get(actual);
                  if (e != null && now - e.checkedAt < 3000) return e;
                  if (!mc.isOnThread()) return e;

                  Path p = CapeFiles.dir().resolve(actual);
                  long mod;
                  try {
                      mod = Files.getLastModifiedTime(p).toMillis();
                  } catch (Exception ex) {
                      return e;
                  }
                  if (e != null && e.modified == mod) {
                      e.checkedAt = now;
                      return e;
                  }
                  if (e != null && e.id != null) {
                      try {
                          mc.getTextureManager().destroyTexture(e.id);
                      } catch (Throwable ignored) {
                      }
                  }
                  Entry n = load(actual, p, mod, mc);
                  n.checkedAt = now;
                  CACHE.put(actual, n);
                  return n;
              }

              private static Entry bad(long mod, String why) {
                  return new Entry(null, 0, 0, false, why, mod);
              }

              private static Entry load(String name, Path p, long mod, MinecraftClient mc) {
                  try {
                      if (Files.size(p) > 16L * 1024 * 1024) return bad(mod, "file lebih dari 16MB");
                      NativeImage img;
                      try (InputStream in = Files.newInputStream(p)) {
                          img = NativeImage.read(in);
                      }
                      int w = img.getWidth();
                      int h = img.getHeight();
                      if (w < 64 || w % 64 != 0 || h * 2 != w) {
                          img.close();
                          return bad(mod, "ukuran " + w + "x" + h + " salah (harus 2:1, kelipatan 64x32)");
                      }
                      if (w > 4096) {
                          img.close();
                          return bad(mod, "terlalu besar (maks 4096x2048)");
                      }
                      Identifier id = Identifier.of(TeamCapeMod.MOD_ID,
                          "cape/" + Long.toHexString(name.toLowerCase(Locale.ROOT).hashCode() & 0xffffffffL) + "_" + Long.toHexString(mod));
                      NativeImageBackedTexture tex = new NativeImageBackedTexture(() -> "teamcape/" + name, img);
                      try {
                          tex.setFilter(true, false);
                      } catch (Throwable ignored) {
                      }
                      mc.getTextureManager().registerTexture(id, tex);
                      return new Entry(id, w, h, true, "", mod);
                  } catch (Throwable t) {
                      TeamCapeMod.LOG.warn("Gagal load cape " + name, t);
                      return bad(mod, "gagal dibaca (PNG rusak?)");
                  }
              }
          }
