            "schemaVersion": 1,
            "id": "teamcape",
            "version": "${version}",
            "name": "Team Cape",
            "description": "Cape custom dari gambar sendiri, kelihatan oleh sesama pemakai mod (termasuk di server).",
            "authors": ["Team"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.teamcape.TeamCapeMod"]
            },
            "mixins": ["teamcape.mixins.json"],
            "depends": {
              "fabricloader": ">=0.17.3",
              "minecraft": "~1.21.11",
