          package com.teamcape;

          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.stream.Stream;

          public final class CapeFiles {
              private CapeFiles() {}

              private static volatile Map<String, String> index = new HashMap<>();
              private static volatile List<String> names = new ArrayList<>();

              public static Path root() {
                  return FabricLoader.getInstance().getGameDir().resolve("teamcape");
              }

              public static Path dir() {
                  return root().resolve("capes");
              }

              public static void ensure() {
                  try {
                      Files.createDirectories(dir());
                  } catch (IOException e) {
                      TeamCapeMod.LOG.warn("Gagal bikin folder cape", e);
                  }
              }

              public static boolean safeName(String n) {
                  if (n == null || n.isEmpty() || n.length() > 80) return false;
                  if (n.indexOf('/') >= 0 || n.indexOf('\\') >= 0 || n.contains("..")) return false;
                  return n.toLowerCase(Locale.ROOT).endsWith(".png");
              }

              public static void refresh() {
                  List<String> out = new ArrayList<>();
                  try (Stream<Path> s = Files.list(dir())) {
                      s.filter(Files::isRegularFile)
                          .map(p -> p.getFileName().toString())
                          .filter(CapeFiles::safeName)
                          .forEach(out::add);
                  } catch (IOException ignored) {
                  }
                  out.sort(String.CASE_INSENSITIVE_ORDER);
                  Map<String, String> idx = new HashMap<>();
                  for (String n : out) idx.put(n.toLowerCase(Locale.ROOT), n);
                  index = idx;
                  names = out;
              }

              public static List<String> list() {
                  return Collections.unmodifiableList(new ArrayList<>(names));
              }

              /** Cari nama file asli (tidak peka huruf besar/kecil). null kalau tidak ada. */
              public static String actual(String wanted) {
                  if (wanted == null) return null;
                  return index.get(wanted.toLowerCase(Locale.ROOT));
              }
          }
