          package com.teamcape;

          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import net.minecraft.client.MinecraftClient;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URI;
          import java.nio.charset.StandardCharsets;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;

          /**
           * Sinkronisasi pilihan cape antar anggota tim lewat topic ntfy (tanpa server sendiri).
           * Yang dikirim cuma: username + NAMA FILE cape. Gambarnya diambil dari folder masing-masing pemain,
           * jadi semua anggota harus punya file gambar dengan nama yang sama.
           */
          public final class CapeSync {
              private CapeSync() {}

              private static final Map<String, String> REMOTE = new ConcurrentHashMap<>();
              private static ScheduledExecutorService ex;
              private static volatile long lastPublish = 0;
              private static volatile boolean forcePublish = true;

              public static volatile String selfName = null;

              public static void start() {
                  ex = Executors.newSingleThreadScheduledExecutor(r -> {
                      Thread t = new Thread(r, "teamcape-sync");
                      t.setDaemon(true);
                      return t;
                  });
                  ex.scheduleWithFixedDelay(CapeSync::tick, 8, 25, TimeUnit.SECONDS);
              }

              public static void publishNow() {
                  forcePublish = true;
                  if (ex != null) ex.schedule(CapeSync::tick, 2, TimeUnit.SECONDS);
              }

              /** Cape milik pemain lain (null = tidak ada / off). */
              public static String remote(String playerName) {
                  if (playerName == null) return null;
                  String c = REMOTE.get(playerName.toLowerCase(Locale.ROOT));
                  if (c == null || "-".equals(c)) return null;
                  return c;
              }

              public static Map<String, String> snapshot() {
                  return new LinkedHashMap<>(REMOTE);
              }

              private static boolean topicOk() {
                  String t = CapeConfig.topic();
                  return t != null && t.matches("[A-Za-z0-9_-]{1,64}") && !t.startsWith("__");
              }

              private static void tick() {
                  try {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (mc.world == null || mc.player == null) return;
                      if (!topicOk()) return;
                      long now = System.currentTimeMillis();
                      if (selfName != null && (forcePublish || now - lastPublish > 20L * 60 * 1000)) {
                          forcePublish = false;
                          publish();
                          lastPublish = now;
                      }
                      poll();
                  } catch (Throwable t) {
                      TeamCapeMod.LOG.debug("sync gagal: {}", t.toString());
                  }
              }

              private static String base() {
                  return CapeConfig.server() + "/" + CapeConfig.topic();
              }

              private static HttpURLConnection open(String url) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) URI.create(url).toURL().openConnection();
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(12000);
                  c.setRequestProperty("User-Agent", "teamcape-mod");
                  return c;
              }

              private static void drain(HttpURLConnection c) {
                  try (InputStream in = c.getInputStream()) {
                      in.readAllBytes();
                  } catch (Exception ignored) {
                  }
              }

              private static void publish() throws Exception {
                  String cape = (CapeConfig.enabled && CapeConfig.selected != null && !CapeConfig.selected.isEmpty())
                      ? CapeConfig.selected : "-";
                  JsonObject o = new JsonObject();
                  o.addProperty("u", selfName);
                  o.addProperty("c", cape);
                  byte[] body = o.toString().getBytes(StandardCharsets.UTF_8);
                  HttpURLConnection c = open(base());
                  try {
                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type", "text/plain; charset=utf-8");
                      c.setFixedLengthStreamingMode(body.length);
                      try (OutputStream os = c.getOutputStream()) {
                          os.write(body);
                      }
                      c.getResponseCode();
                      drain(c);
                  } finally {
                      c.disconnect();
                  }
              }

              private static String str(JsonObject o, String k) {
                  if (o == null || !o.has(k) || !o.get(k).isJsonPrimitive()) return null;
                  return o.get(k).getAsString();
              }

              private static void poll() throws Exception {
                  HttpURLConnection c = open(base() + "/json?poll=1&since=12h");
                  try {
                      if (c.getResponseCode() != 200) return;
                      Map<String, Long> times = new HashMap<>();
                      Map<String, String> latest = new HashMap<>();
                      try (BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8))) {
                          String line;
                          int n = 0;
                          while ((line = r.readLine()) != null && n++ < 5000) {
                              try {
                                  JsonObject o = JsonParser.parseString(line).getAsJsonObject();
                                  if (!"message".equals(str(o, "event"))) continue;
                                  long t = o.has("time") ? o.get("time").getAsLong() : 0L;
                                  String msg = str(o, "message");
                                  if (msg == null) continue;
                                  JsonObject m = JsonParser.parseString(msg).getAsJsonObject();
                                  String u = str(m, "u");
                                  String cp = str(m, "c");
                                  if (u == null || cp == null || u.length() > 32) continue;
                                  if (!"-".equals(cp) && !CapeFiles.safeName(cp)) continue;
                                  String key = u.toLowerCase(Locale.ROOT);
                                  Long prev = times.get(key);
                                  if (prev == null || t >= prev) {
                                      times.put(key, t);
                                      latest.put(key, cp);
                                  }
                              } catch (Exception ignored) {
                              }
                          }
                      }
                      REMOTE.putAll(latest);
                  } finally {
                      c.disconnect();
                  }
              }
          }
