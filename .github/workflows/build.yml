# ============================================================
# TEAM CAPE - mod Fabric 1.21.11 (cape custom dari gambar sendiri)
# Cara pakai: simpan file ini sebagai  .github/workflows/build.yml
# di repo GitHub kamu (repo kosong pun bisa), lalu tunggu Actions
# selesai. Hasil .jar ada di tab Releases.
#
# WAJIB: semua anggota tim harus pakai build yang SAMA (TEAM_TOPIC sama).
# Boleh ganti TEAM_TOPIC di bawah (8-64 huruf/angka/_/-) sebelum build.
# Anggap TEAM_TOPIC itu seperti password tim: jangan dibagi ke orang luar.
# ============================================================
name: Build TeamCape

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  TEAM_TOPIC: teamcape-7d28b966932f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate project files
        run: |
          set -e
          mkdir -p . src/main/java/com/teamcape src/main/java/com/teamcape/mixin src/main/resources
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'teamcape'
          EOF_0
          cat > gradle.properties <<'EOF_1'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          fabric_version=0.141.3+1.21.11

          mod_version=1.0.0
          maven_group=com.teamcape
          archives_base_name=teamcape
          EOF_1
          cat > build.gradle <<'EOF_2'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF_2
          cat > src/main/resources/fabric.mod.json <<'EOF_3'
