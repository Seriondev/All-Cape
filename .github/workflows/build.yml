          package com.teamcape;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.AbstractClientPlayerEntity;
          import net.minecraft.entity.player.SkinTextures;

          public final class CapeManager {
              private CapeManager() {}

              private static String fileFor(AbstractClientPlayerEntity p) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (p == mc.player) {
                      if (!CapeConfig.enabled) return null;
                      String s = CapeConfig.selected;
                      return (s == null || s.isEmpty()) ? null : s;
                  }
                  if (!CapeConfig.showOthers) return null;
                  return CapeSync.remote(p.getName().getString());
              }

              /** Dipanggil dari mixin. Return null kalau skin asli tidak perlu diubah. */
              public static SkinTextures apply(AbstractClientPlayerEntity p, SkinTextures orig) {
                  if (orig == null) return null;
                  String file = fileFor(p);
                  if (file == null) return null;
                  CapeTextures.Entry e = CapeTextures.get(file);
                  if (e == null || !e.valid || e.asset == null) return null;
                  return new SkinTextures(orig.body(), e.asset, orig.elytra(), orig.model(), orig.secure());
              }
          }
