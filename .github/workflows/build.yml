          cat > src/main/java/com/teamcape/CapeConfig.java <<'EOF_6'
          package com.teamcape;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;

          import java.nio.file.Files;
          import java.nio.file.Path;

          public final class CapeConfig {
              private CapeConfig() {}

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              public static volatile boolean enabled = true;
              public static volatile boolean showOthers = true;
              public static volatile String selected = "";

              private static final class Data {
                  boolean enabled = true;
                  boolean showOthers = true;
                  String selected = "";
                  // opsional: isi manual di config.json kalau mau override
                  String topic = null;
                  String server = null;
              }

              private static Data data = new Data();

              public static Path file() {
                  return CapeFiles.root().resolve("config.json");
              }

              public static String topic() {
                  String t = data.topic;
                  return (t != null && !t.isBlank()) ? t.trim() : TeamCapeMod.DEFAULT_TOPIC;
              }

              public static String server() {
                  String s = data.server;
                  String v = (s != null && !s.isBlank()) ? s.trim() : "https://ntfy.sh";
                  while (v.endsWith("/")) v = v.substring(0, v.length() - 1);
                  return v;
              }

              public static void load() {
                  try {
                      Path f = file();
                      if (Files.exists(f)) {
                          Data d = GSON.fromJson(Files.readString(f), Data.class);
                          if (d != null) {
                              data = d;
                              enabled = d.enabled;
                              showOthers = d.showOthers;
                              selected = d.selected == null ? "" : d.selected;
                          }
                      }
                  } catch (Exception e) {
                      TeamCapeMod.LOG.warn("Gagal baca config", e);
                  }
                  save();
              }

              public static synchronized void save() {
                  try {
                      data.enabled = enabled;
                      data.showOthers = showOthers;
                      data.selected = selected == null ? "" : selected;
                      Files.createDirectories(CapeFiles.root());
                      Files.writeString(file(), GSON.toJson(data));
                  } catch (Exception e) {
                      TeamCapeMod.LOG.warn("Gagal simpan config", e);
                  }
              }
          }
