          package com.teamcape;

          import net.minecraft.client.gl.RenderPipelines;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          import java.util.ArrayList;
          import java.util.List;

          public class CapeMenuScreen extends Screen {
              public static volatile boolean openRequested = false;

              private static final int ROW_H = 24;
              private static final int LIST_TOP = 60;

              private final Screen parent;
              private List<String> files = new ArrayList<>();
              private int page = 0;
              private int perPage = 3;
              private String status = "";

              public CapeMenuScreen(Screen parent) {
                  super(Text.literal("Team Cape"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  CapeFiles.refresh();
                  files = new ArrayList<>(CapeFiles.list());
                  build();
              }

              private Text toggleLabel() {
                  return Text.literal("Cape kamu: " + (CapeConfig.enabled ? "ON" : "OFF"))
                      .formatted(CapeConfig.enabled ? Formatting.GREEN : Formatting.RED);
              }

              private static String shorten(String s) {
                  return s.length() <= 24 ? s : s.substring(0, 21) + "...";
              }

              private void build() {
                  this.clearChildren();
                  int cx = this.width / 2;
                  perPage = Math.max(1, (this.height - 44 - LIST_TOP) / ROW_H);
                  int pages = Math.max(1, (files.size() + perPage - 1) / perPage);
                  if (page >= pages) page = pages - 1;
                  if (page < 0) page = 0;

                  this.addDrawableChild(ButtonWidget.builder(toggleLabel(), b -> {
                      CapeConfig.enabled = !CapeConfig.enabled;
                      CapeConfig.save();
                      CapeSync.publishNow();
                      b.setMessage(toggleLabel());
                  }).dimensions(cx - 70, 22, 140, 20).build());

                  int listLeft = cx - 150;
                  int start = page * perPage;
                  for (int i = 0; i < perPage && start + i < files.size(); i++) {
                      final String name = files.get(start + i);
                      int y = LIST_TOP + i * ROW_H;
                      boolean sel = name.equalsIgnoreCase(CapeConfig.selected);
                      Text label = Text.literal(shorten(name)).formatted(sel ? Formatting.GREEN : Formatting.WHITE);
                      this.addDrawableChild(ButtonWidget.builder(label, b -> chooseCape(name))
                          .dimensions(listLeft + 18, y, 170, 20).build());
                  }

                  int by = this.height - 28;
                  int bw = Math.max(40, Math.min(70, (this.width - 24) / 4 - 4));
                  int total = bw * 4 + 12;
                  int bx = cx - total / 2;

                  ButtonWidget prev = ButtonWidget.builder(Text.literal("< Prev"), b -> {
                      page--;
                      build();
                  }).dimensions(bx, by, bw, 20).build();
                  prev.active = page > 0;
                  this.addDrawableChild(prev);

                  ButtonWidget next = ButtonWidget.builder(Text.literal("Next >"), b -> {
                      page++;
                      build();
                  }).dimensions(bx + bw + 4, by, bw, 20).build();
                  next.active = page < pages - 1;
                  this.addDrawableChild(next);

                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Refresh"), b -> {
                      CapeFiles.refresh();
                      files = new ArrayList<>(CapeFiles.list());
                      status = "Folder di-scan ulang: " + files.size() + " gambar";
                      build();
                  }).dimensions(bx + (bw + 4) * 2, by, bw, 20).build());

                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Tutup"), b -> this.close())
                      .dimensions(bx + (bw + 4) * 3, by, bw, 20).build());
              }

              private void chooseCape(String name) {
                  CapeTextures.Entry e = CapeTextures.get(name);
                  if (e == null || !e.valid) {
                      status = "Gambar tidak valid: " + (e == null ? "tidak terbaca" : e.problem);
                      return;
                  }
                  CapeConfig.selected = name;
                  CapeConfig.enabled = true;
                  CapeConfig.save();
                  CapeSync.publishNow();
                  status = "Dipakai: " + name;
                  build();
              }

              private void drawCapeFace(DrawContext ctx, CapeTextures.Entry e, int x, int y, int w, int h) {
                  ctx.fill(x - 1, y - 1, x + w + 1, y + h + 1, 0xFF303030);
                  if (e == null || !e.valid) {
                      ctx.drawTextWithShadow(this.textRenderer, "!", x + w / 2 - 2, y + h / 2 - 4, 0xFFFF5555);
                      return;
                  }
                  int s = e.width / 64;
                  ctx.drawTexture(RenderPipelines.GUI_TEXTURED, e.id, x, y, (float) s, (float) s, w, h, 10 * s, 16 * s, e.width, e.height);
              }

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  super.render(ctx, mouseX, mouseY, delta);
                  int cx = this.width / 2;
                  int pages = Math.max(1, (files.size() + perPage - 1) / perPage);

                  ctx.drawCenteredTextWithShadow(this.textRenderer, this.title, cx, 8, 0xFFFFFFFF);
                  ctx.drawCenteredTextWithShadow(this.textRenderer,
                      Text.literal("teamcape/capes  -  hal " + (page + 1) + "/" + pages), cx, 46, 0xFFAAAAAA);

                  if (files.isEmpty()) {
                      ctx.drawWrappedTextWithShadow(this.textRenderer,
                          Text.literal("Belum ada gambar. Taruh file .png cape di folder .minecraft/teamcape/capes lalu klik Refresh."),
                          cx - 150, LIST_TOP, 300, 0xFFFFFF55);
                  }

                  int listLeft = cx - 150;
                  int start = page * perPage;
                  for (int i = 0; i < perPage && start + i < files.size(); i++) {
                      String name = files.get(start + i);
                      drawCapeFace(ctx, CapeTextures.get(name), listLeft, LIST_TOP + i * ROW_H, 12, 20);
                  }

                  if (this.width >= 300) {
                      int ph = Math.min(96, this.height - 44 - LIST_TOP - 12);
                      if (ph >= 32) {
                          int pw = ph * 5 / 8;
                          String sel = CapeConfig.selected;
                          CapeTextures.Entry e = (sel == null || sel.isEmpty()) ? null : CapeTextures.get(sel);
                          drawCapeFace(ctx, e, cx + 80, LIST_TOP, pw, ph);
                      }
                  }

                  if (!status.isEmpty()) {
                      ctx.drawCenteredTextWithShadow(this.textRenderer, Text.literal(status), cx, this.height - 40, 0xFFFFFF55);
                  }
              }

              @Override
              public void close() {
                  if (this.client != null) this.client.setScreen(parent);
              }
          }
          EOF_11
          cat > src/main/java/com/teamcape/mixin/AbstractClientPlayerEntityMixin.java <<'EOF_12'
          package com.teamcape.mixin;

          import com.teamcape.CapeManager;
          import net.minecraft.client.network.AbstractClientPlayerEntity;
          import net.minecraft.entity.player.SkinTextures;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(AbstractClientPlayerEntity.class)
          public abstract class AbstractClientPlayerEntityMixin {
              @Inject(method = "getSkin", at = @At("RETURN"), cancellable = true)
              private void teamcape$getSkin(CallbackInfoReturnable<SkinTextures> cir) {
                  SkinTextures custom = CapeManager.apply((AbstractClientPlayerEntity) (Object) this, cir.getReturnValue());
                  if (custom != null) {
                      cir.setReturnValue(custom);
                  }
              }
          }
          EOF_12

      - name: Pasang TEAM_TOPIC
        run: |
          [[ "$TEAM_TOPIC" =~ ^[A-Za-z0-9_-]{8,64}$ ]] || { echo "TEAM_TOPIC harus 8-64 karakter: huruf, angka, _ atau -"; exit 1; }
          sed -i "s/__TEAM_TOPIC__/${TEAM_TOPIC}/" src/main/java/com/teamcape/TeamCapeMod.java
          grep -n "DEFAULT_TOPIC" src/main/java/com/teamcape/TeamCapeMod.java

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TeamCape build ${{ github.run_number }}
          files: build/libs/*.jar
