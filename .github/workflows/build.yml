          package com.teamcape;

          import com.mojang.brigadier.context.CommandContext;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.command.v2.FabricClientCommandSource;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents;
          import net.minecraft.text.Text;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          import java.util.Map;

          public class TeamCapeMod implements ClientModInitializer {
              public static final String MOD_ID = "teamcape";
              public static final Logger LOG = LoggerFactory.getLogger(MOD_ID);
              // diganti otomatis oleh build.yml (TEAM_TOPIC)
              public static final String DEFAULT_TOPIC = "__TEAM_TOPIC__";

              private static int tickCounter = 0;

              @Override
              public void onInitializeClient() {
                  CapeFiles.ensure();
                  CapeConfig.load();
                  CapeFiles.refresh();
                  CapeSync.start();

                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) -> {
                      dispatcher.register(ClientCommandManager.literal("cape")
                          .executes(ctx -> status(ctx))
                          .then(ClientCommandManager.literal("on").executes(ctx -> {
                              CapeConfig.enabled = true;
                              CapeConfig.save();
                              CapeSync.publishNow();
                              say(ctx, "Cape kamu: ON");
                              return 1;
                          }))
                          .then(ClientCommandManager.literal("off").executes(ctx -> {
                              CapeConfig.enabled = false;
                              CapeConfig.save();
                              CapeSync.publishNow();
                              say(ctx, "Cape kamu: OFF");
                              return 1;
                          }))
                          .then(ClientCommandManager.literal("others")
                              .then(ClientCommandManager.literal("on").executes(ctx -> {
                                  CapeConfig.showOthers = true;
                                  CapeConfig.save();
                                  say(ctx, "Lihat cape teman: ON");
                                  return 1;
                              }))
                              .then(ClientCommandManager.literal("off").executes(ctx -> {
                                  CapeConfig.showOthers = false;
                                  CapeConfig.save();
                                  say(ctx, "Lihat cape teman: OFF");
                                  return 1;
                              })))
                          .then(ClientCommandManager.literal("reload").executes(ctx -> {
                              CapeFiles.refresh();
                              CapeSync.publishNow();
                              say(ctx, "Folder cape di-scan ulang: " + CapeFiles.list().size() + " gambar");
                              return 1;
                          }))
                          .then(ClientCommandManager.literal("who").executes(ctx -> {
                              Map<String, String> m = CapeSync.snapshot();
                              if (m.isEmpty()) {
                                  say(ctx, "Belum ada teman yang terdeteksi (tunggu ~30 detik, pastikan topic sama).");
                              }
                              for (Map.Entry<String, String> e : m.entrySet()) {
                                  String c = e.getValue();
                                  String extra = "-".equals(c) ? "(cape off)" : (CapeFiles.actual(c) == null ? "(file TIDAK ada di folder kamu)" : "");
                                  say(ctx, e.getKey() + " -> " + c + " " + extra);
                              }
                              return 1;
                          })));

                      dispatcher.register(ClientCommandManager.literal("capemenu").executes(ctx -> {
                          CapeMenuScreen.openRequested = true;
                          return 1;
                      }));
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (CapeMenuScreen.openRequested) {
                          CapeMenuScreen.openRequested = false;
                          client.setScreen(new CapeMenuScreen(null));
                      }
                      tickCounter++;
                      if (tickCounter % 100 == 0) {
                          CapeFiles.refresh();
                      }
                      if (client.player != null && tickCounter % 20 == 0) {
                          CapeSync.selfName = client.player.getName().getString();
                      }
                  });

                  ClientPlayConnectionEvents.JOIN.register((handler, sender, client) -> CapeSync.publishNow());
              }

              private static int status(CommandContext<FabricClientCommandSource> ctx) {
                  String sel = CapeConfig.selected == null || CapeConfig.selected.isEmpty() ? "(belum dipilih)" : CapeConfig.selected;
                  say(ctx, "Cape kamu: " + (CapeConfig.enabled ? "ON" : "OFF") + " | file: " + sel);
                  say(ctx, "Lihat cape teman: " + (CapeConfig.showOthers ? "ON" : "OFF") + " | /capemenu, /cape on|off, /cape who, /cape reload");
                  return 1;
              }

              private static void say(CommandContext<FabricClientCommandSource> ctx, String msg) {
                  ctx.getSource().sendFeedback(Text.literal("[Cape] " + msg));
              }
          }
